# LP2025 partial-editing fine-tune.
#
# Every value here is the released run's own, read out of the config Lightning
# wrote at startup: runs_word_fill_plate_512/20260419-180408/config.yaml. Its
# timestamp matches the wandb record run-20260419_180409-gloox8hm to a second.
#
# An earlier revision of this file reconstructed four of these fields from a
# sibling run and got them wrong -- the optimizer, the accumulation, the save
# interval, and the missing reuse_lora_path. Anything cached or trained from
# that revision does not reproduce the paper.
#
# This is stage 2. It resumes from stage 1 (configs/lp2025_stage1.yaml).

dtype: bfloat16                                   # [artifact] bnb_4bit_compute_dtype
flux_path: ./FLUX.1-Fill-dev                      # quantised to NF4 on load by
                                                  # src/train/model.py [artifact]
model_type: flux_fill

train:
  batch_size: 1
  # Effective batch is 64. src/train/callbacks.py counts one "step" per batch,
  # not per optimizer step, which is why 43784 steps over 2569 samples reads
  # as epoch 17 in the wandb record.
  accumulate_grad_batches: 64
  condition_type: word_fill
  dataloader_workers: 8
  gradient_checkpointing: true
  # The run set max_steps: -1 and was stopped by hand at 43784. Validation
  # loss stopped improving well before that; the released checkpoint is 27606,
  # the 43rd save. There is no reason to train past about 28k.
  max_steps: 43784

  # Stage 1's adapter. Point this at your own stage-1 output; the original is
  # runs_word_fill_plate_512/20260415-150207/ckpt/21250, trained on 20k
  # synthetic plates with Prodigy. Without it this is a single-stage run and
  # will not match the paper.
  reuse_lora_path: ./runs_lp2025_stage1/ckpt/21250/adapter_model.safetensors

  dataset:
    type: word
    image_size: 512                               # [lineage]
    train_cache_root: ./cache/lp_train            # 2,569 samples  [logged]
    valid_cache_root: ./cache/lp_val              #   620 samples  [logged]
    val_check_interval: 1284
    limit_val_batches: 620                        # the whole validation split

  lora_config:                                    # all [artifact]
    r: 32
    lora_alpha: 32
    init_lora_weights: gaussian
    lora_dropout: 0.0
    use_dora: false
    use_rslora: false
    target_modules: (.*x_embedder|.*(?<!single_)transformer_blocks\.[0-9]+\.norm1\.linear|.*(?<!single_)transformer_blocks\.[0-9]+\.attn\.to_k|.*(?<!single_)transformer_blocks\.[0-9]+\.attn\.to_q|.*(?<!single_)transformer_blocks\.[0-9]+\.attn\.to_v|.*(?<!single_)transformer_blocks\.[0-9]+\.attn\.to_out\.0|.*(?<!single_)transformer_blocks\.[0-9]+\.ff\.net\.2|.*single_transformer_blocks\.[0-9]+\.norm\.linear|.*single_transformer_blocks\.[0-9]+\.proj_mlp|.*single_transformer_blocks\.[0-9]+\.proj_out|.*single_transformer_blocks\.[0-9]+\.attn.to_k|.*single_transformer_blocks\.[0-9]+\.attn.to_q|.*single_transformer_blocks\.[0-9]+\.attn.to_v|.*single_transformer_blocks\.[0-9]+\.attn.to_out)

  # AdamW, not Prodigy. Stage 1 uses Prodigy at lr=1; stage 2 switches because
  # Prodigy suppresses its learned rate when started from warm weights, and
  # this stage starts from stage 1's adapter.
  optimizer:
    type: AdamW
    params:
      lr: 0.0001
      weight_decay: 0.01

  odm_loss:
    modelpath: ./weights/epoch_100.pt
    w_loss_1: 20
    w_loss_2: 20
    w_loss_3: 20
    w_loss_4: 20
    w_loss_f: 1

  sample_interval: 642
  save_interval: 642                              # 27606 = 642 x 43, the released save
  save_path: runs_lp2025

  wandb:
    project: LP2025-PlateEdit
