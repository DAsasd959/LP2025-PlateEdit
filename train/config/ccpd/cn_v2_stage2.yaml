# Stage-2 v2：省份均衡真實 CCPD + LP-2025 真實，混合訓練 5,000 步（新檔）
# =============================================================================
# 這一版要修掉的是上一次（runs_cn_stage2_real*，累計 10,000 步）的崩壞：
#
#   舊：8,000 張真實 CCPD，其中 95.9% 是皖，且每一步都遮省份格
#       -> 10,000 步裡約 9,425 次「答案都是皖」
#       -> 模型學會忽略 glyph 條件；字元清楚率從 31/40 掉到 1/40
#       -> loss 也印證：val loss 前幾百步就見底後反升，train loss 後 8,000 步只降 2.6%
#
#   新：1,777 張省份均衡真實 CCPD（皖 5.63%，31 省全到，全部來自 ccpd_base）
#       + 2,569 張 LP-2025 真實（英數字，補上另一個域）
#       遮罩 province_ratio=0.5
#       -> 退化目標消失，所以可以安全地跑到 5,000 步
#
# 步數 5,000 的依據：
#   已知「2,000 次省份格更新」能把筆寬修到與真實無法區分（累計 4,000 那個點，
#   配對差 -0.032、2SE 0.096）。5,000 步 x 均衡集佔比，中文更新約 1,250 次，
#   逼近那個已驗證的水準；同時兩個資料集都只跑約 1 個 epoch。
#   save_interval=1000，所以 5,000 是「上限」而不是賭注 —— 跑完從 5 個
#   checkpoint 裡用「字形 + 筆寬」兩軸挑最好的。
#
# 驗證集刻意換成新切的 90 張均衡驗證集（每省 3 張）。
# 舊的 cn_real8k_valid 有 96% 是皖，val loss 看不出中文有沒有退化。
flux_path: ./weights/flux_base
dtype: "bfloat16"
model_type: flux_fill

train:
  batch_size: 1
  accumulate_grad_batches: 1
  dataloader_workers: 8
  max_steps: 10000
  save_interval: 1000
  sample_interval: 500
  gradient_checkpointing: true
  save_path: "runs_cn_v2_stage2"

  condition_type: "word_fill"
  limit_val_batches: 90          # 驗證集只有 90 筆，全部跑完
  dataset:
    # 純 CCPD 均衡真實 1,777 筆。刻意不混入 LP-2025：
    # Stage-1 的 cache 片段長度 100% 是 1 字（data_plate_partial.py:88-103 的 fallback
    # 固定回傳 (start, start+1)），而 LP 有 75.2% 是 3 字以上 —— 模型沒有多字元切分的
    # 監督，靠 Stage-2 的 2,956 次更新學不會。LP 留到 v3 連同遮罩策略一起修。
    train_cache_root: ./cache/ccpd_stage2_train_v1
    valid_cache_root: ./cache/ccpd_stage2_val_v1
    type: "word"
    glyph_scale: 1
    image_size: 512
    val_check_interval: 500      # 密一點，才抓得到 val loss 的最低點

  wandb:
    project: "FLUXText_plate_baseline"

  # Stage-1 v2 的 20,000 步成果（訓練啟動前由腳本填入實際路徑）
  reuse_lora_path: ./weights/ccpd_stage1_ckpt_20000/adapter_model.safetensors

  lora_config:
    r: 32
    lora_alpha: 32
    init_lora_weights: "gaussian"
    target_modules: "(.*x_embedder|.*(?<!single_)transformer_blocks\\.[0-9]+\\.norm1\\.linear|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_k|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_q|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_v|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_out\\.0|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.2|.*single_transformer_blocks\\.[0-9]+\\.norm\\.linear|.*single_transformer_blocks\\.[0-9]+\\.proj_mlp|.*single_transformer_blocks\\.[0-9]+\\.proj_out|.*single_transformer_blocks\\.[0-9]+\\.attn.to_k|.*single_transformer_blocks\\.[0-9]+\\.attn.to_q|.*single_transformer_blocks\\.[0-9]+\\.attn.to_v|.*single_transformer_blocks\\.[0-9]+\\.attn.to_out)"

  # 與論文一致：Stage-2 改用 AdamW，因為 Prodigy 在 warm start 會壓低學習率（Sec 4.1）
  optimizer:
    type: "AdamW"
    params:
      lr: 0.0001
      weight_decay: 0.01

  odm_loss:
    modelpath: ./weights/odm_epoch_100.pt
    w_loss_f: 1
    w_loss_1: 20
    w_loss_2: 20
    w_loss_3: 20
    w_loss_4: 20
